<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="kg-app-title kg-app-desc">
  <title id="kg-app-title">KawnGraph app icon</title>
  <desc id="kg-app-desc">KawnGraph app icon: the universe mark — a central ringed project planet linked to code, docs, and data planets — on a dark rounded tile.</desc>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#070A0F"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#F4F7FB" stroke-opacity="0.06"/>
  <g transform="translate(256 256) scale(6.2) translate(-32 -32)">
    <g fill="none" stroke="#4C8DFF" stroke-width="1.2" opacity="0.42">
      <ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(-20 32 32)"/>
      <ellipse cx="32" cy="32" rx="10" ry="23" transform="rotate(15 32 32)"/>
    </g>
    <g stroke="#22C7A9" stroke-width="1.3" opacity="0.65" stroke-linecap="round">
      <line x1="32" y1="32" x2="42" y2="14"/>
      <line x1="32" y1="32" x2="43" y2="50"/>
      <line x1="32" y1="32" x2="11" y2="32"/>
    </g>
    <circle cx="42" cy="14" r="4.2" fill="#4C8DFF"/>
    <circle cx="43" cy="50" r="4" fill="#F6C85F"/>
    <circle cx="11" cy="32" r="4.6" fill="#42D392"/>
    <circle cx="32" cy="32" r="8.5" fill="#22C7A9"/>
    <ellipse cx="32" cy="32" rx="15" ry="5" fill="none" stroke="#F4F7FB" stroke-width="2" opacity="0.85" transform="rotate(-22 32 32)"/>
  </g>
</svg>
